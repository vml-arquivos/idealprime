name: Ideal Prime CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A versão do pnpm é lida do campo "packageManager" do package.json.
      # Não declarar "version" aqui para evitar:
      # "Multiple versions of pnpm specified".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify migrations
        run: pnpm migrate:verify

      - name: TypeScript check
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Build application
        run: pnpm build

      - name: Build Docker image
        run: docker build -t ideal-prime:${{ github.sha }} .
